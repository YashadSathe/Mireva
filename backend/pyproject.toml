[project]
name = "mireva"
version = "0.1.0"
description = "Mireva RAG Foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "cohere>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=1.0.0",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.52",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.4",
    "voyageai>=0.5.0",
    "xxhash>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/api",
    "src/app",
    "src/core",
    "src/db",
    "src/exceptions",
    "src/models",
    "src/observability",
    "src/rag",
    "src/schemas",
    "src/services",
    "src/storage",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test.",
]
